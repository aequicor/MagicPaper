# Include this server in nginx's http context; adjust listen/server_name/root.
server {
    listen 8080;
    server_name _;
    root /srv/magicpaper;
    index index.html;
    include mime.types;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Preserve the address bar. Route IDs can contain dots, including .js/.wasm.
    location ~ ^/(chat|projects|settings|docs|plugins)(/|$) {
        try_files $uri /index.html;
    }
    location ~ \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }
    location ~ \.m?js$ {
        default_type text/javascript;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
